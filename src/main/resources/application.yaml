server:
  port: {SERVER_PORT}
  # nginx reaches the API over plain HTTP. Read its X-Forwarded-* headers so the
  # API sees the browser's https origin; otherwise every save looks cross-origin
  # to the CORS check and gets 403.
  forward-headers-strategy: framework

# household-api's database. Every request names a household in X-Household-Id, and
# home-household-spring checks the member belongs to it there.
household:
  database: ${HOUSEHOLD_DATABASE:HOUSEHOLD}

# Cloudflare Access: the "home" Access application's team domain and AUD tag.
access:
  team-domain: ${ACCESS_TEAM_DOMAIN:}
  aud: ${ACCESS_AUD:}

app:
  cors:
    allowed-origins:
      - ${CORS_ORIGINS:http://localhost:4200}

spring:
  application:
    name: home-budget
  data:
    mongodb:
      uri: ${MONGO_APP_URL}
      database: ${MONGO_DATABASE}


management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

